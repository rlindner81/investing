# NFLX (Netflix, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD thousands.
# Source: SEC reports under NFLX/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to NFLX:
#   - 10-FOR-1 FORWARD STOCK SPLIT effected 2025-11-14. The daily price CSV is
#     split-adjusted, so ALL shares_outstanding are on the POST-split basis:
#     pre-split balance-sheet counts (through q3-2025) are ×10 here so that
#     price × shares stays consistent (e.g. 423,732,334 → 4,237,323,340).
#   - Only capitalized line in investing is "Purchases of property and equipment"
#     (content spend runs through operating CF as additions to content assets),
#     so `company` and `strict` FCF coincide.
#   - Q4 has no standalone income-statement column in the 10-K; revenue is
#     computed as FY total − 9-month YTD (subtraction shown inline).
#   - Guidance: Netflix guides a single-point NEXT-QUARTER revenue number in the
#     shareholder letter (entered as low=high). Full-year REVENUE guidance only
#     began at q3-2024 (for FY2025); earlier quarters guided margin/FCF, not a
#     revenue range, so their FY rows use a hint. q3-2025 gave a point FY2025
#     figure ($45.1B), entered low=high.

