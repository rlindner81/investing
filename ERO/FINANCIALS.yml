# ERO (Ero Copper Corp.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD THOUSANDS. Ero's
# presentation currency IS the US dollar ("Amounts in thousands of US Dollars"),
# even though it is a Canadian (BC) company whose Brazilian subsidiaries have the
# BRL as functional currency — so NO FX conversion is needed and no `currency:`
# key is set. Source: SEC 6-K financial statements under ERO/quarters/.
# See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to ERO:
#   - MJDS FILER: Ero files a 40-F annually and furnishes quarterly results on
#     FORM 6-K (no 10-Q/10-K). Each 6-K carries three exhibits: the financial
#     statements (`erocopper-fsx<year>q<n>.htm` → our `report`), the MD&A, and the
#     earnings press release (`erocopper-pressreleasex202.htm` → our `letter`).
#     `fetch-sources` cannot auto-discover these (it looks for `ex99`-named
#     exhibits, which Ero does not use), so SOURCES.yml pins the full exhibit URL.
#   - Interim statements carry FOUR columns: 3-month current, 3-month prior-year,
#     YTD current, YTD prior-year. `revenue` is the standalone 3-month figure,
#     taken directly for Q1-Q3. Q4 has no standalone column in the annual
#     statements, so it is computed as FY total − 9-month YTD (comment shows it).
#   - TWO capex lines, so company and strict FCF differ:
#       ytd_capex_ppe         = "Additions to mineral properties, plant and
#                               equipment" (called "mineral property" singular in
#                               the 2023 filings) — the line Ero nets for its own
#                               free cash flow.
#       ytd_capex_exploration = "Additions to exploration and evaluation assets",
#                               a separate investing outflow → strict FCF only.
#   - FCF was deeply NEGATIVE through FY2023-FY2024 while the Tucumã Project was
#     built (FY2023 company FCF −$284.1M, FY2024 −$183.5M); it turned positive in
#     FY2025 (+$132.4M) as Tucumã ramped. P/FCF is therefore n/m for the earlier
#     trailing windows.
#   - SBC CAN GO NEGATIVE in a standalone quarter. A large part of Ero's awards
#     are CASH-SETTLED (PSUs/RSUs/DSUs remeasured to the share price each period),
#     so a falling share price reverses previously booked expense. Q4-2024 is the
#     clearest case: FY2024 SBC 9,983 < 9-month YTD 17,479 → standalone −7,496.
#     This is as-reported, not a transcription error.
#   - NO REVENUE GUIDANCE. Like other miners, Ero guides annual PRODUCTION
#     (copper tonnes, gold ounces), C1 cash cost, AISC and capital expenditures —
#     never revenue (revenue = production × metal price, which it does not
#     forecast). So the FY guidance row carries a "prod-guided" hint rather than
#     invented numbers, the NQ guidance row stays blank, and the forward-P/S rows
#     stay blank.
#   - shares_outstanding is the point-in-time common share count from the
#     "Balance, <period end>" row of the statement of changes in shareholders'
#     equity (the statements themselves print only weighted averages), expressed
#     in the file's unit (thousands), like shares_short.
#     Share count stepped up ~9M in Q4-2023 (Sept 2023 equity raise): 93.4M → 102.7M.
#   - total_debt = current portion of loans and borrowings + long-term loans and
#     borrowings. Lease liabilities are EXCLUDED (IFRS 16 operating leases, not
#     financial debt) — noted per quarter where relevant.
#   - Operations are three Brazilian mines: Caraíba and Tucumã (copper) and
#     Xavantina (gold).

