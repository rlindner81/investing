# NOW (ServiceNow, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS
#   (ServiceNow reports its income statement and balance sheet in millions).
# Source: SEC reports under NOW/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to NOW:
#   - 5-FOR-1 STOCK SPLIT effective December 17, 2025. The daily price CSV is
#     split-adjusted, so shares_outstanding are on the POST-split basis:
#     pre-split balance-sheet counts (through q3-2025) are multiplied by 5.
#     Post-split reports (q4-2025 onward) are already on the new basis.
#     Shares are entered in MILLIONS (point-in-time total outstanding, net of
#     treasury) so that price × shares yields a market cap in millions to match
#     revenue's unit.
#   - Only capitalized line is PP&E (`Purchases of property and equipment`), so
#     `company` and `strict` FCF differ only by SBC. Small `Purchases of other
#     intangibles` amounts exist but are NOT capex for FCF; folded into strict via
#     ytd_capex_intangibles where the filing breaks it out.
#   - `revenue` is TOTAL revenue (subscription + professional services), standalone.
#   - GUIDANCE QUIRK: ServiceNow guides SUBSCRIPTION revenue only (next quarter and
#     full year), never total revenue. The guidance_* rows below therefore carry the
#     SUBSCRIPTION guidance, so the forward-P/S rows measure market cap against the
#     guided subscription base (~97% of total). Guidance issued at each report from
#     the 8-K earnings press release (erq#fy##.htm).
#   - Q4 has no standalone income-statement column in the 10-K: revenue computed as
#     FY total − 9-month YTD. OCF/capex/SBC for Q4 entries are the full-year YTD
#     values (the tool differences them against Q3 to recover standalone).

unit: millions

