# TTWO (Take-Two Interactive) — figures for multiple calculations.
# FISCAL YEAR ENDS MARCH 31 (non-calendar): FY2026 = Apr 2025–Mar 2026, so
#   q1-fy2026 ended 2025-06-30 … q4-fy2026 ended 2026-03-31.
# All monetary values in USD MILLIONS (the filings report in $ millions).
# Source: SEC reports under TTWO/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to TTWO:
#   - TWO capex lines. `ytd_capex_ppe` = "Purchases of fixed assets" (investing
#     section) → matches company/"free cash flow" convention. `ytd_capex_software`
#     = the cash spent capitalizing "Software development costs and licenses" (the
#     game-development capex buried in the operating-activities changes-in-assets
#     line). The strict FCF flavour nets BOTH plus SBC; company FCF = OCF − PP&E.
#   - shares_outstanding = common issued − treasury (23.7M held throughout), from
#     the balance-sheet cover parenthetical, in millions.
#   - announce_date is the item-2.02 8-K acceptance date. Through q4-2026 every
#     earnings 8-K was furnished ~16:15 ET (after-close). Starting q1-2027 (the
#     GTA VI year) TTWO moved to a PRE-MARKET release: the q1-2027 8-K was accepted
#     03:37 ET with an 8:00 a.m. ET call, so announce_session is `pre-open`.
#   - GUIDANCE: TTWO prints a GAAP total-net-revenue "Outlook" range for both the
#     full year and the next quarter in every earnings release, alongside its
#     headline Net Bookings guidance. The revenue ranges are transcribed here.
#   - Perennially GAAP-unprofitable over this window (goodwill impairments FY2024
#     $2.34B, FY2025 $3.55B tied to Zynga); OCF swings around game launches.
#     GTA VI ships in FY2027 — the FY2027 initial guide ($7.9–8.1B net revenue,
#     $8.0–8.2B net bookings) is the pre-launch baseline.

