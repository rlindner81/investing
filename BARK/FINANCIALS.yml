# BARK (Bark Inc.) — figures for multiple calculations.
# FISCAL YEAR ENDS MARCH 31 (non-calendar): FY2026 = Apr 2025–Mar 2026, so
#   q1-2026 ended 2025-06-30 … q4-2026 ended 2026-03-31.
# All monetary values in USD thousands. Source: SEC reports under BARK/quarters/.
#
# Notes specific to BARK:
#   - 1-for-20 REVERSE SPLIT (calendar 2026). The daily price CSV is split-adjusted,
#     so shares_outstanding are on the POST-split basis: pre-split reports ÷ 20
#     (e.g. 169,732,895 → 8,486,645). Keeps price × shares consistent.
#   - Only capex line is "Capital expenditures" → company & strict FCF coincide.
#   - Cash-flow is negative (BARK burns cash), so P/FCF is n/m throughout.

unit: thousands

