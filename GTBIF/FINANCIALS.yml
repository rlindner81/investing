# GTBIF (Green Thumb Industries Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD thousands.
# Source: SEC reports under GTBIF/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to GTBIF:
#   - Three share classes: Subordinate Voting Shares (SVS), Multiple Voting Shares (MVS),
#     Super Voting Shares. MVS and Super each convert to SVS at 100:1 economically.
#     shares_outstanding = SVS + MVS×100 + Super×100 (confirmed from exchange rollforwards).
#   - Only capitalized line is PP&E, so `company` and `strict` FCF are identical.
#   - GTBIF does not issue dollar-range guidance; only qualitative sequential hints
#     starting Q3-2025. guidance_nq_hint used throughout.
#   - Trades OTC as GTBIF; also listed on CSE as GTII (USD price used throughout).

