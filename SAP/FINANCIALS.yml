# SAP (SAP SE) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in EUR millions.
# Source: SAP quarterly earnings press releases (6-K EX-99.1) under SAP/quarters/
#   *-letter.md, cross-checked against the annual 20-F reports. See CLAUDE.md
#   → "Valuation Multiples".
#
# Notes specific to SAP:
#   - FOREIGN PRIVATE ISSUER (German). Files ANNUAL 20-F only; quarterly results
#     are furnished on 6-K. No quarterly XBRL is submitted to the SEC, so every
#     quarterly figure here is transcribed by hand from the 6-K press releases —
#     specifically the "Financial and Non-Financial Key Facts" table, which prints
#     each quarter STANDALONE (total revenue, operating cash flow, free cash flow,
#     cash, financial debt).
#   - currency: EUR. check-valuation fetches USDEUR=X and converts fundamentals to
#     USD; the NYSE ADR (1 ADR = 1 ordinary share) price is already USD.
#   - CASH FLOW IS ENTERED AS CUMULATIVE YTD (the schema convention: the tool
#     differences consecutive quarters within a fiscal year to recover standalone).
#     SAP's press release prints STANDALONE quarters, so ytd_operating_cf below is
#     the running sum within each calendar year (Q1, Q1+Q2, Q1+Q2+Q3, full year).
#     This reproduces SAP's own formal YTD cash-flow statement exactly.
#   - CAPEX LINE: SAP's "free cash flow" = operating cash flow − net purchases of
#     intangibles/PP&E − lease payments. There is no single capex line that alone
#     reconciles company FCF, so ytd_capex_ppe here is set to (YTD OCF − YTD FCF),
#     i.e. the full deduction SAP applies. This makes `company` FCF (OCF − capex)
#     reproduce SAP's printed free cash flow. Only one capex line is used, so
#     `company` and `strict` FCF differ solely by the SBC add-back.
#   - SHARES: SAP has a constant 1,229M issued ordinary shares; it funds share-based
#     compensation from treasury rather than issuing new stock. shares_outstanding
#     is issued (1,229) net of treasury (the "effect of treasury shares" from the
#     20-F EPS note, ~62-63M), i.e. ~1,166-1,168M. Exact quarterly treasury counts
#     are not disclosed, so interim quarters use the year's net-of-treasury level.
#   - GUIDANCE: SAP guides FULL-YEAR ONLY (cloud revenue + cloud-and-software
#     revenue at constant currency, and free cash flow). It does NOT guide total
#     revenue or next-quarter revenue. guidance_fy_revenue_* below holds the FY
#     CLOUD-AND-SOFTWARE revenue guidance (constant currency) — the closest
#     revenue-line guide SAP issues — NOT total revenue. The FW P/S FY guidance row
#     therefore divides market cap by guided cloud+software revenue, which is a
#     subset of total revenue. NQ guidance rows stay empty (none is given).

unit: millions
currency: EUR

