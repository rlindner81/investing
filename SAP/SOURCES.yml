  # results are furnished on 6-K (EX-99.1 = earnings press release with the IFRS
  # quarterly income statement, balance sheet, cash flow, and revenue guidance).
  # Reports in EUR. No quarterly XBRL is submitted to the SEC, so every quarterly
  # figure in FINANCIALS.yml is transcribed by hand from the 6-K press releases.
  home_exchange: xetra          # stockanalysis.com keys SAP under its US NYSE ADR though
  home_ticker: SAP

