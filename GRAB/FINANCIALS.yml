# GRAB (Grab Holdings Limited) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD millions.
# Source: quarterly 6-K earnings press releases (EX-99.1) under GRAB/quarters/.
# See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to GRAB:
#   - FOREIGN PRIVATE ISSUER reporting under IFRS. No 10-Q/10-K: an annual 20-F
#     plus quarterly results furnished on 6-K. The EX-99.1 press release is the
#     source for every figure here — it carries the full condensed IFRS income
#     statement, balance sheet and cash flow statement.
#   - Reports in USD (Grab's presentation currency) despite operating across
#     Southeast Asia, so no `currency` conversion is needed.
#   - GRAB guides FULL-YEAR Group revenue only (no next-quarter revenue guide),
#     so guidance_nq_* stays empty and the FY rows carry the raise trajectory.
#     Guidance is also given for full-year Adjusted EBITDA (not tracked here).
#   - Q4 revenue is printed directly as a standalone quarter column in the Q4
#     press release, so no FY-minus-9-month subtraction is needed.
#   - ROUNDING: Grab reports in whole \$M, so summed quarters can miss the printed
#     FY total by \$1M. FY2025 sums to 3,371 vs. the reported 3,370 (FY2024 and
#     FY2023 tie exactly). Immaterial to every multiple; do not "fix" a quarter.
#   - TWO capex lines: `ytd_capex_ppe` (acquisition of PP&E) and
#     `ytd_capex_software` (purchase of intangible assets). `company` FCF uses
#     PP&E only; `strict ex SBC` removes intangibles and SBC as well.
#   - shares_outstanding = Class A + Class B ordinary shares at period end, from
#     the per-share note in the press release (reported in millions).
#   - total_debt = current + non-current "Loans and borrowings". The jump from
#     ~$360M to ~$1.9B in q2-2025 is the $1.5B convertible notes issued Jun 2025.
#   - Grab's own "Adjusted Free Cash Flow" excludes financial-services loan
#     receivable and bank deposit flows; it is NOT what the FCF rows here show.
#     The rows here are plain OCF − capex off the IFRS statement, so they run
#     well below Grab's Adjusted FCF whenever the digibank balance sheet grows.
#     FY2025 reconciles exactly: 79 OCF − 188 capex + 16 disposals + 691 loan
#     receivables − 308 deposits = 290 Adjusted FCF (FY2024 likewise → 162).
#     Note their "capital expenditures" (188 in FY2025) also includes assets
#     acquired under leases, so it exceeds the cash-flow-statement capex lines
#     transcribed here (97 PP&E + 26 intangibles = 123).

unit: millions

