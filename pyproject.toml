[project]
name = "investing"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
fetch-report = "investing.fetch_report:main"
fetch-transcript = "investing.fetch_transcript:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investing"]
