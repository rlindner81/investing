[project]
name = "investing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "yfinance>=0.2",
    "rich>=13",
    "numpy>=2.5.1",
]

[project.scripts]
discover-filings = "investing.discover_filings:main"
fetch-sources = "investing.fetch_sources:main"
fetch-transcript = "investing.fetch_transcript:main"
fetch-prices = "investing.fetch_prices:main"
check-prices = "investing.check_prices:main"
check-valuation = "investing.check_valuation:main"
check-reaction = "investing.check_reaction:main"
check-shape = "investing.check_shape:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investing"]
