# PYPL (PayPal Holdings, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS (PayPal
# reports in millions). Source: SEC reports under PYPL/quarters/.
# See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to PYPL:
#   - Reports in millions (unit: millions), not thousands.
#   - Cash-flow statements are YEAR-TO-DATE (Q1=3mo, Q2=6mo, Q3=9mo, Q4/10-K=12mo),
#     exactly matching the tool's YTD-differencing convention. Q4 revenue has no
#     standalone column in the 10-K → computed as FY total − 9-month YTD (comment
#     shows the subtraction).
#   - Only capitalized line is "Purchases of property and equipment" → `company`
#     and `strict` FCF differ only by SBC (ytd_sbc supplied).
#   - shares_outstanding = common shares outstanding (net of treasury) from the
#     balance-sheet cover parenthetical, in millions.
#   - cash = "Cash and cash equivalents" only (EXCLUDES the ~$38B of customer
#     "funds receivable and customer accounts", which is restricted customer money,
#     not corporate liquidity). total_debt = "Long-term debt" (PayPal carries no
#     separate short-term corporate borrowings line; "funds payable" is customer
#     money). Net cash is therefore deeply negative — PayPal is net-debt on this
#     conservative basis; the customer-funds float is not counted as cash.
#   - GUIDANCE QUIRK: PayPal only published explicit NEXT-QUARTER revenue-growth
#     guidance through Q3-2023 (converted to $ ranges below off the prior-year
#     quarter). Beginning with the Q4-2023 report (Feb 2024, first full CEO Alex
#     Chriss cycle) the company GUIDES ONLY ON EPS (GAAP/non-GAAP) and transaction-
#     margin-dollar growth — no revenue-dollar or revenue-growth guidance. Those
#     quarters carry guidance_nq_hint/guidance_fy_hint: "eps-only". PayPal has never
#     guided FULL-YEAR revenue in dollars, so the FY revenue guidance rows stay empty
#     throughout (FY guide is EPS-only).
#   - Announcement timing: 2023 earnings were released AFTER market close; from
#     Q1-2024 (Apr 2024) onward PayPal moved to PRE-OPEN (~7am ET) releases.

unit: millions

