benchmarks:
  etfs:
    - symbol: SPY
      issuer: State Street Global Advisors
      description: Tracks the S&P 500 — the broad US large-cap benchmark
    - symbol: QQQ
      issuer: Invesco
      description: Tracks the Nasdaq-100 — US large-cap technology and growth
    - symbol: XLC
      issuer: State Street Global Advisors
      description: Tracks communication services stocks within the S&P 500 — holds Alphabet, Meta, Netflix, T-Mobile
    - symbol: XLY
      issuer: State Street Global Advisors
      description: Tracks consumer discretionary stocks within the S&P 500
    - symbol: SOCL
      issuer: Global X (Mirae Asset)
      description: Tracks global social media and social networking companies
    - symbol: PAWZ
      issuer: ProShares
      description: Tracks companies across the pet care industry including food, health, and accessories
    - symbol: ONLN
      issuer: ProShares
      description: Tracks global companies at the forefront of online and e-commerce retail
    - symbol: IGV
      issuer: iShares (BlackRock)
      description: Tracks expanded US tech-software sector — holds Salesforce, Adobe, Workday, ServiceNow
    - symbol: KWEB
      issuer: KraneShares
      description: Tracks Chinese internet companies — holds JD, Alibaba, Tencent, Meituan, Baidu
    - symbol: MCHI
      issuer: iShares (BlackRock)
      description: Tracks the MSCI China Index — broad China market across sectors and cap sizes
    - symbol: MSOS
      issuer: AdvisorShares
      description: Tracks US multi-state cannabis operators — focused on plant-touching US businesses
    - symbol: GLUX.DE
      issuer: Amundi
      description: Tracks the S&P Global Luxury Index — holds LVMH, L'Oréal, Hermès, Richemont and other global luxury leaders. EUR-denominated, Frankfurt-listed.
    - symbol: GDX
      issuer: VanEck
      description: Tracks the NYSE Arca Gold Miners Index — global gold-mining companies including Newmont, Agnico Eagle, Barrick, Kinross
    - symbol: GLD
      issuer: State Street Global Advisors (World Gold Council sponsor)
      description: Tracks the spot price of physical gold bullion — the metal itself, not miners. The purest gold-price benchmark for isolating commodity beta from mining-equity risk.
    - symbol: ILF
      issuer: iShares (BlackRock)
      description: Tracks the S&P Latin America 40 — large-cap Latin American equities across Brazil, Mexico, Chile; holds MercadoLibre, Vale, Petrobras, banks
    - symbol: IPAY
      issuer: Amplify (formerly ETFMG)
      description: Tracks the Prime Mobile Payments Index — global digital-payments and card-network companies including Visa, Mastercard, PayPal, Block, Fiserv, Global Payments

  peers:
    - symbol: BKNG
      description: Booking Holdings — largest online travel agency, owns Booking.com, Priceline, Kayak
    - symbol: EXPE
      description: Expedia Group — online travel platform, owns Hotels.com, Vrbo, Trivago

