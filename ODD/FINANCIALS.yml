# ODD (Oddity Tech) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD thousands.
# Source: SEC reports under ODD/quarters/. See CLAUDE.md → "FINANCIALS.yml" for the schema.
#
#   revenue            standalone quarter, from the income statement
#   shares_outstanding point-in-time total (all classes) at quarter end, from the
#                      balance sheet / 10-Q cover page — NOT the weighted average
#   shares_short       short interest at the FINRA semi-monthly settlement NEAREST end_date,
#                      so it pairs with the quarter-end shares_outstanding it divides.
#                      Source: FINRA consolidatedShortInterest API (cross-checked against
#                      Nasdaq). The "% of shares out" row is derived — never enter a percent.
#   short_settlement_date  the FINRA settlement date that reading came from; drives the
#                      "(-3d)" staleness suffix when it isn't exactly quarter end.
#   ytd_operating_cf   net cash from operating activities, AS REPORTED (year-to-date)
#   ytd_capex_*        capitalized investment lines, year-to-date. Naming convention:
#                        ytd_capex_ppe   → purchase of PP&E; the ONLY line in `company` FCF
#                        ytd_capex_<x>   → any other capitalized spend (software, content,
#                                          R&D, …). `strict` FCF subtracts ALL ytd_capex_*.
#                      Each key becomes its own "CapEx <x>" row automatically.
#   guidance_nq_/guidance_fy_revenue_low/high  next-quarter / full-year revenue guidance
#                                 issued AT THIS quarter's report (FY updates each quarter → the
#                                 row shows the raise trajectory).
#   guidance_nq_/guidance_fy_hint  short text shown INSTEAD of a range when guidance was not
#                                 given (e.g. "withdrawn", "withheld") — explains why it's blank.
#   est_fy_revenue_low/high       my own full-year estimate (independent of guidance)

