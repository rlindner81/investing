# MELI (MercadoLibre, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS (the SEC
# statements are presented "$ in Millions"). Source: SEC reports under
# MELI/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to MELI:
#   - Reports in USD (Nasdaq-listed Uruguayan/LatAm operator), so no currency
#     conversion. Values are whole millions — coarser than SNAP's thousands.
#   - Revenue = "Net revenues and financial income" (the total top line, which
#     includes fintech financial income). In the FY2024 10-K MELI RECAST the
#     presentation, moving interest/financial income into the revenue top line;
#     2023 figures here use the RECAST basis (from the 2024 10-Q comparatives)
#     so every quarter is on one consistent revenue definition. (As originally
#     reported, FY2023 "Net revenues" was 14,473; recast it is 15,107.)
#   - Q4 has no standalone column in the 10-K: computed as FY total − 9-month YTD,
#     with the subtraction shown inline.
#   - Single capex line ("Investments of property and equipment", later
#     "Investments in property and equipment, intangible assets and intangible
#     assets at fair value"), so `company` and `strict` FCF differ only by SBC.
#   - SBC proxy = "Long term retention program (LTRP) accrued compensation", the
#     non-cash comp add-back in the cash-flow statement (MELI has no conventional
#     stock-based comp line).
#   - shares_outstanding = common shares issued and outstanding (net of treasury)
#     from the cover page / balance sheet. Single share class. Expressed in
#     MILLIONS to match `unit` (e.g. 50,697,182 shares → 50.697182).
#   - GUIDANCE: MercadoLibre issues NO numeric forward guidance (long-standing
#     policy); the earnings press releases are qualitative only. The guidance
#     rows are therefore left empty for every quarter.
#   - total_debt = current + non-current "Loans payable and other financial
#     liabilities". MELI carries substantial debt but also large cash + a fintech
#     balance sheet (loans receivable, funds payable), so net debt here is a crude
#     read of leverage only.

