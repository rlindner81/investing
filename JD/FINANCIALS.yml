# JD (JD.com, Inc.) — figures for valuation multiples.
# Fiscal year = calendar year. All monetary values in RMB MILLIONS.
# Source: SEC filings (6-K / 20-F) under JD/quarters/.
#
# Notes specific to JD:
#   - currency: CNY  →  check-valuation fetches the live USD/CNY rate and converts
#     all fundamentals to USD on the fly. Prices from NASDAQ (USD per ADS).
#   - 1 ADS = 2 ordinary shares. shares_outstanding stores millions of ADS
#     (= ordinary shares / 2), matching the NASDAQ price quoted per ADS.
#   - CAPEX: JD breaks out two lines in their FCF reconciliation:
#       ytd_capex_ppe   = "Capital expenditures for development properties"
#                         (logistics infrastructure, warehouses, land use rights)
#       ytd_capex_other = "Other capital expenditures"
#                         (HQ construction, tech equipment, software, etc.)
#     company FCF = OCF − capex_ppe; strict FCF = OCF − capex_ppe − capex_other.
#     JD's own reported FCF additionally adjusts for consumer financing receivables
#     (typically ±1–2 B RMB); our strict FCF omits that adjustment.
#   - Q3-2024 and Q3-2025 standalone OCF/capex are from the quarterly letter
#     (the formal 6-K exhibit auto-extraction failed); 9M YTD values are computed.
#   - JD does NOT provide formal quarterly or annual revenue guidance.
#   - balance sheet: cash = cash and cash equivalents only. total_debt = short-term
#     debts + unsecured senior notes (current + non-current) + long-term borrowings.

unit: millions
currency: CNY

