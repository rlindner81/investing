# NBIX (Neurocrine Biosciences, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS (the filings
# themselves are tabled in millions, so no rescaling is applied).
# Source: SEC reports under NBIX/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to NBIX:
#   - Only capitalized line is "Capital expenditures", so `company` and `strict`
#     FCF differ only by the SBC add-back.
#   - GUIDANCE IS FOR INGREZZA NET PRODUCT SALES ONLY, NOT TOTAL REVENUE.
#     NBIX has never guided consolidated revenue: each February it issues a
#     full-year INGREZZA (valbenazine) net-product-sales range and updates it
#     through the year. Total revenue runs ABOVE that guide because it also
#     carries CRENESSITY (launched Dec 2024), VYKAT XR (from the May 2026 Soleno
#     acquisition) and collaboration revenue. The `guidance_fy_revenue_*` rows
#     below therefore UNDERSTATE the revenue base, and `FW P/S FY guidance` is
#     correspondingly overstated — read it as an INGREZZA-only multiple, not a
#     forward total-revenue multiple. No next-quarter guidance is ever given, so
#     the NQ rows stay empty.
#   - No guidance update was issued at the q1-2023 or q2-2023 reports; the
#     February FY2023 guide simply stood. Those rows carry the standing range
#     with a comment.
#   - Convertible senior notes were the only debt; fully settled during 2024
#     (a \$138.4M charge runs through FY2024). total_debt is 0 from q2-2024 on.
#     The May 2026 Soleno acquisition was funded by a \$600M revolver draw that
#     was drawn AND repaid within q2-2026, so total_debt is still 0 at 6/30/26.
#   - Cash understates liquidity throughout: NBIX parks most of its balance in
#     available-for-sale debt securities (current + noncurrent), which `cash`
#     deliberately excludes per the schema (cash and cash equivalents only).
#   - Announcement sessions flipped mid-history: through q3-2024 NBIX released
#     pre-market (~07:00 ET) with an 8:00 AM ET call; from q4-2024 on it releases
#     after the close (~16:02 ET) with a 4:30 PM ET call.
#   - q4-2022 is a reach-back quarter kept only as the standalone-OCF/capex diff
#     base and TTM feed for FY2023; it is outside check-valuation's display window.

unit: millions

