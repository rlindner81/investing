# ABNB (Airbnb, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS.
# Source: SEC reports under ABNB/quarters/ (10-Q / 10-K). See CLAUDE.md → "FINANCIALS.yml".
#
# Notes specific to ABNB:
#   - unit is MILLIONS (not thousands): ABNB rounds every figure — revenue, cash
#     flow, and share counts — to the million in its filings, so millions is the
#     native, loss-free granularity.
#   - Values were pulled from EDGAR XBRL companyfacts and cross-checked against
#     the downloaded reports:
#       revenue            → us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
#       ytd_operating_cf   → us-gaap:NetCashProvidedByUsedInOperatingActivities
#     (see ABNB/xbrl-to-financials.yml for the full validated mapping).
#   - CAPEX: ABNB is asset-light and does NOT break out a "purchases of property
#     and equipment" line in its condensed cash-flow statement — any PP&E spend is
#     immaterial and netted inside "Other investing activities, net". So
#     ytd_capex_ppe = 0 and company FCF = operating cash flow, matching how ABNB
#     itself reports Free Cash Flow. (PP&E capex was tagged only in FY2023 at
#     ~$15–30M YTD, <1% of OCF.)
#   - shares_outstanding: point-in-time total across Class A + B + C + H, summed
#     from the balance-sheet parenthetical (Class C and H are 0). The steady
#     decline reflects ABNB's ongoing buyback.
#   - Q4 revenue has no standalone fact (the 10-K tags the 12-month total only);
#     it is derived as FY total − 9-month YTD. ytd_operating_cf at Q4 is the
#     full-year figure as reported.
#   - GUIDANCE ROWS ARE NOT YET FILLED — ABNB guides next-quarter revenue in its
#     shareholder letter (not in XBRL); add from the press release / transcript.

unit: millions

