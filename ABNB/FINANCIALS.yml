# ABNB (Airbnb, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS.
# Source: SEC reports under ABNB/quarters/ (10-Q / 10-K). See CLAUDE.md → "FINANCIALS.yml".
#
# Notes specific to ABNB:
#   - unit is MILLIONS (not thousands): ABNB rounds every figure — revenue, cash
#     flow, and share counts — to the million in its filings, so millions is the
#     native, loss-free granularity.
#   - CAPEX: ABNB is asset-light — no separate PP&E line in recent cash-flow
#     statements (netted into "Other investing activities, net"). ytd_capex_ppe = 0
#     → company FCF = OCF, matching how ABNB itself reports Free Cash Flow.
#   - shares_outstanding: Class A + Class B OUTSTANDING from the balance-sheet
#     parenthetical (XBRL detail R-doc, e.g. R3.htm), each rounded to the million at
#     the PERIOD-END date — not the cover-page count, not weighted-average. ABNB holds
#     no treasury stock (buybacks are retired), so issued == outstanding in every
#     parenthetical. Class C is 0 and Class H (~9M) is excluded. Steady decline reflects
      ongoing buyback.
#   - Q4 revenue = FY total − 9-month YTD (no standalone 10-K fact).
#   - GUIDANCE: ABNB guides next quarter only (dollar range). No full-year revenue
#     guidance is given in dollar terms; the Q4 letters give qualitative FY hints.
#     Source for all guidance: quarterly shareholder letters (see sources.json → letter).

