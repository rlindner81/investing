# WDAY (Workday, Inc.) — figures for multiple calculations.
# FISCAL YEAR ENDS JANUARY 31 (non-calendar): FY2026 = Feb 2025–Jan 2026, so
#   q1-fy2026 ended 2025-04-30 … q4-fy2026 ended 2026-01-31.
# All monetary values in USD MILLIONS (the filings report $ in millions from the
#   FY2024 10-K onward). Source: SEC reports under WDAY/quarters/.
#
# Notes specific to WDAY:
#   - `revenue` = SUBSCRIPTION revenue, NOT total revenue. Workday guides only
#     subscription revenue (next quarter as a point, full year as a range) plus a
#     non-GAAP operating-margin target — it does not guide total revenue. Using
#     subscription revenue keeps the revenue row, the guidance rows, the forward
#     P/S rows and the beat/miss math on ONE consistent basis. Total revenue runs
#     ~8% higher (professional services is a low-margin implementation pass-through
#     of ~$180-190M/quarter); see business-plan.md for the total-revenue figures.
#   - Q4 subscription revenue has no standalone column in the 10-K: computed as
#     FY subscription total − 9-month YTD subscription (subtraction shown inline).
#   - `cash` = cash & equivalents + marketable securities. WDAY parks the bulk of
#     its liquidity (~$4-7B) in short-term marketable securities, so cash-only
#     would wrongly show the company as deeply net-debt. `total_debt` = the
#     convertible senior notes (current + noncurrent).
#   - Only capitalized line is "Capital expenditures" (PP&E), so `company` and
#     `strict ex-SBC` FCF differ only by the SBC add-back.
#   - shares_outstanding = point-in-time total (Class A + Class B, net of treasury)
#     from the equity-rollforward statement (10-Qs) / balance-sheet parenthetical
#     (10-Ks), in millions.
#   - report_date = earnings-announcement date (the 8-K press-release date), which
#     is 1-2 weeks before the 10-Q/10-K filing date and is the price reference.
#   - Q1 and Q2 of FY2025 releases gave only next-quarter subscription guidance
#     (no restated full-year line), so those FY guidance fields are omitted.

unit: millions

