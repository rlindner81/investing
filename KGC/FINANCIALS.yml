# KGC (Kinross Gold Corporation) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS (Kinross
# reports its financials "expressed in millions of U.S. dollars"). Reporting
# currency is USD, so no FX conversion. shares_outstanding is also in millions
# (common shares issued and outstanding, from the balance sheet cover count).
# Source: SEC 6-K news releases under KGC/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to KGC:
#   - MJDS FILER: Kinross files a 40-F annually and furnishes quarterly results on
#     FORM 6-K (no 10-Q/10-K). Each quarter's figures are transcribed from the
#     earnings NEWS RELEASE 6-K, whose condensed consolidated statements carry a
#     standalone "Three months ended" column — so `revenue` is taken directly for
#     Q1-Q3. Q4 has no standalone column in the annual release, so it is computed
#     as FY total − 9-month YTD (comment shows the subtraction).
#   - NO REVENUE GUIDANCE. Kinross guides annual PRODUCTION (gold-equivalent oz),
#     production cost of sales, all-in sustaining cost and capital expenditures —
#     never revenue (revenue = production × the gold price, which it does not
#     forecast). So the FY guidance row carries a "prod-guided" hint rather than
#     invented numbers, the NQ guidance row is simply blank, and the forward-P/S
#     rows stay blank.
#   - FCF flavours: `ytd_capex_ppe` = "Additions to property, plant and equipment"
#     (the line Kinross nets against operating cash flow for its own free cash
#     flow). `ytd_capex_interest` = "Interest paid capitalized to property, plant
#     and equipment", a separate investing outflow — folded only into the strict
#     ex-capex FCF. company FCF here is a TOTAL figure (OCF − PP&E additions);
#     Kinross's headline "attributable free cash flow" is a bit lower because it
#     strips the non-controlling-interest (Manh Choh JV, 70%-owned) minority
#     (e.g. FY2024 attributable $1,340.2M vs total OCF−PP&E $1,370.9M;
#      FY2025 attributable $2,473.5M).
#   - Share-based compensation is immaterial (<$15M/yr) and is omitted.
#   - Shares outstanding fell through 2025-2026 on a buyback (1,229M → 1,194M).
#   - 2023 operating cash flow is the "continuing operations" line; discontinued
#     operations (Russia/Ghana, divested 2022) were nil in 2023, so it equals total.

