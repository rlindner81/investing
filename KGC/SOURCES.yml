_meta:
  cik: "0000701818"
  # Kinross Gold is a Canadian MJDS filer: it files a 40-F annually (audited
  # statements) and furnishes quarterly results on FORM 6-K. There is no 10-Q/10-K.
  # `report` points at the earnings NEWS RELEASE 6-K (its EX-99.1 carries the
  # condensed consolidated statements of operations, balance sheets and cash flows).
  # A separate same-cluster 6-K holds the MD&A. Kinross does NOT guide revenue —
  # it guides production (Au eq. oz), cost of sales and capex — so there is no
  # investor "letter" with revenue guidance; the news release doubles as the report.
  #
  # HOME EXCHANGE: KGC is the NYSE ADR ticker, but stockanalysis.com lists Kinross
  # under its Canadian home listing (Toronto, TSX:K). The generic US transcript
  # path `stockanalysis.com/stocks/kgc/` 404s — transcript URLs live under
  # `stockanalysis.com/quote/tsx/K/transcripts/<id>-<quarter>/` instead.
  home_exchange: tsx
  home_ticker: K

