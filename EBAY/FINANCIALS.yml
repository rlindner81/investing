# EBAY (eBay Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD millions (eBay reports in
# millions, so precision is limited to the filing's rounding).
# Source: SEC reports/letters under EBAY/quarters/, cross-checked against EDGAR XBRL
# companyfacts. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to EBAY:
#   - Only capitalized line is PP&E ("Purchases of property and equipment"), so
#     `company` and `strict` FCF are identical apart from SBC.
#   - OCF = "Net cash provided by CONTINUING operating activities" — eBay's own FCF
#     (continuing OCF − PP&E purchases) is built on that line. Discontinued-ops cash
#     (small, legacy divestiture tails) is excluded.
#   - ASU 2025-06 (internal-use software) adopted 2026-01-01, full retrospective. The
#     2026 10-Qs restate 2025 comparatives: OCF and capex BOTH drop by the same amount
#     (Q1-25 787/143 → 755/111; H1-25 480/277 → 415/212), so FCF is unchanged. Values
#     here are as ORIGINALLY reported for each quarter (2025 on the old basis, 2026 on
#     the new) — TTM OCF/capex across the 2025/26 boundary mix bases, TTM FCF does not.
#   - Q1-2025 10-Q was amended (10-Q/A, 2025-05-09); figures unchanged.
#   - Guidance: next-quarter revenue range every quarter (8-K EX-99.1 "Business
#     Outlook"). Full-year revenue ranges are only printed at the Q3 report (i.e.
#     FY = implied Q4). Q2-2026 is the exception: the CFO guided FY2026 revenue growth
#     of 11–12% FX-neutral on the call, converted here on the FY2025 base.
#   - shares_outstanding = balance-sheet common shares outstanding (millions, rounded),
#     net of treasury. Single share class.
#   - total_debt = short-term debt (current notes + commercial paper) + long-term debt.
#   - report_date = announce_date = the earnings 8-K (item 2.02) date. eBay always
#     releases at ~4:05pm ET (after-close). The 10-Q/10-K usually files 1–7 days later,
#     which is the date prefix on the quarters/ files and SOURCES.yml keys.

