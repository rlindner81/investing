# BSP (Bending Spoons S.p.A.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD thousands (US GAAP,
# USD reporting currency despite the Italian domicile — no `currency` needed).
# Sources: Q2-2026 6-K EX-99.1 under BSP/quarters/; pre-IPO history from the
# 424B4 prospectus saved at BSP/press/2026-06-30_ipo-prospectus.md.
#
# Notes specific to BSP:
#   - IPO'd 2026-07-01 (Nasdaq: BSP, $29). q2-2026 is the FIRST reported quarter;
#     every earlier quarter is pre-listing (no report_date, no price) and exists
#     only as a TTM / YTD diff base.
#   - The prospectus gives FY2023/24/25 annual + Q1-2025/Q1-2026 interim only; the
#     Q2-2026 6-K adds Q2-2025 / H1-2025 comparatives. FY2023 and FY2024 have no
#     quarterly split at all and are omitted.
#   - Q3-2025 was NEVER published standalone. q3-2025 below is a PLACEHOLDER split
#     of H2-2025 (= FY2025 − H1-2025):
#       revenue 347,000 ≈ Q3-2026 guidance midpoint 739,000 ÷ 2.13 ("113% growth
#         at the midpoint", press release) — approximate (±~1.5M from rounding);
#       YTD cash-flow lines = H1-2025 + half of H2-2025.
#     The split does NOT affect any TTM ending q4-2025 or later (those depend only
#     on the H2 sum, which is exact) — only the q3-2025 column itself. Replace
#     with the comparatives once the Q3-2026 6-K is out (~Nov 2026).
#   - Q1-2026 OCF is the RESTATED figure (75,654; originally 123,654 — $48M of
#     Eventbrite restricted cash was misclassified into operating cash flow).
#   - Capex: PP&E purchases plus a tiny "Purchase of intangible assets" line
#     (ytd_capex_intangibles). Acquisitions (the real capital deployment —
#     $1.85B in 2025, $2.29B in H1-2026) are NOT capex in either FCF flavour.
#   - BSP does not print a FCF figure; it cites "net cash from operating
#     activities" and capex separately (H1-2026: $254M OCF vs ~$4M capex).
#   - Share counts are split-adjusted (stock split 2026-04-28 + reverse split
#     2026-05-29) and net of treasury: issued − treasury from the equity statement.
#     Ordinary + class A (5 votes, founders) combined.
#   - Guidance: next-quarter AND full-year revenue (plus adj. operating income),
#     based only on businesses owned at the report date — no pending deals.

