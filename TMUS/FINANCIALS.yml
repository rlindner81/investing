# TMUS (T-Mobile US, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD MILLIONS (T-Mobile
# reports in millions); share counts also in millions. Source: SEC reports and
# 8-K EX-99.1 press releases under TMUS/quarters/, cross-checked against EDGAR
# XBRL companyfacts. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to TMUS:
#   - Cash-flow statement is YEAR-TO-DATE (also prints a 3-month column); entered
#     as YTD. Q4 revenue = FY total − 9-month YTD (comment shows the subtraction).
#   - ytd_capex_ppe = "Purchases of property and equipment, including capitalized
#     interest". ytd_capex_spectrum = "Purchases of spectrum licenses and other
#     intangible assets, including deposits" — lumpy (auction 108 in Q3-2024,
#     UScellular/other spectrum in 2025), so it only feeds the `strict` FCF row.
#   - FCF RECONCILIATION QUIRK: T-Mobile's "Adjusted Free Cash Flow" = OCF − cash
#     PP&E capex + proceeds from tower-site sales + "proceeds related to beneficial
#     interests in securitization transactions" (an investing-section inflow from
#     the EIP/service-receivable securitizations). Those proceeds were large through
#     2024 (FY2023 4,816; FY2024 3,579) and ZERO from 2025 on, so:
#       FY2023: 18,559 − 9,801 = 8,758  vs company 13,586 (+12 tower +4,816 BI)
#       FY2024: 22,293 − 8,840 = 13,453 vs company 17,032 (+3,579 BI)
#       FY2025: 27,950 − 9,955 = 17,995 vs company ~18.0B  (reconciles)
#     The `company` FCF row here therefore UNDERSTATES TMUS's own 2023–2024 FCF.
#     Kept as OCF − PP&E for schema consistency (the BI proceeds are not a capex
#     line and the tool has no add-back key).
#   - total_debt = Short-term debt + Long-term debt + Long-term debt to affiliates
#     (DT-held notes; 1,498 repaid by Q1-2026). EXCLUDES financing-lease liabilities
#     (~1.2B short + ~1.2B long) and tower obligations; T-Mobile's own "net debt"
#     includes financing leases, so its headline is slightly higher.
#   - shares_outstanding = common shares outstanding net of treasury, from the
#     balance-sheet parenthetical (single class). Dec-2023 jump (+33.8M) = 48.8M
#     SoftBank contingent shares issued, net of buybacks.
#   - GUIDANCE QUIRK: T-Mobile NEVER guides revenue (not even service revenue) —
#     FY guidance is postpaid net customer (2026: net ACCOUNT) adds, Core Adjusted
#     EBITDA, OCF, cash capex and Adjusted FCF; no quarterly guidance at all. So
#     guidance_fy_hint: ebitda-only / guidance_nq_hint: not-guided throughout; the
#     Core Adj. EBITDA and Adj. FCF ranges as issued at each report are recorded in
#     comments (USD millions). FY2026 guide includes UScellular (closed Aug 1 2025).
#   - Announcement timing alternates: Q2/Q3/Q4 releases are often PRE-OPEN, Q1 and
#     some others AFTER-CLOSE; each entry's session is from the 8-K item 2.02
#     acceptance timestamp.

unit: millions

