# LYFT (Lyft, Inc.) — figures for multiple calculations.
# Fiscal year = calendar year. All monetary values in USD thousands.
# Source: SEC reports under LYFT/quarters/. See CLAUDE.md → "Valuation Multiples".
#
# Notes specific to LYFT:
#   - Only capitalized line is "Purchases of property and equipment and scooter
#     fleet" (ytd_capex_ppe), so `company` and `strict` FCF differ only by SBC.
#   - Cash-flow lines are entered YTD as reported; the tool differences
#     consecutive quarters within a fiscal year. Q4 revenue is FY − 9mo YTD.
#   - LYFT guides GROSS BOOKINGS + Adjusted EBITDA + Rides growth, NOT a revenue
#     dollar range, so revenue-guidance rows carry a guidance_nq_hint instead of
#     numbers (see PYPL for the analogous "no revenue $ guidance" pattern).
#   - shares_outstanding = point-in-time Class A + Class B total at quarter end
#     (cover page). Class B (8.5M founder shares) fully converted to Class A
#     during Q3-2025, so from q3-2025 on the total is Class A only.
#   - Q4-2025 recorded a $2.9B deferred-tax benefit (valuation-allowance release)
#     that flows through net income and OCF; the DTA add-back is inside OCF as
#     reported, which is what FCF uses.

unit: thousands

